<!doctype html><html><head><meta charset='utf-8'><title>Security Headers - Sim</title></head><body>
<h1>Security Headers Checker (Simulation)</h1>
<p>Enter any URL (simulation) and press Check — this is a frontend-only teaching tool.</p>
<input id="url" placeholder="https://example.com"><button id="chk">Check</button>
<div id="res" style="border:1px solid #ccc;padding:8px;margin-top:8px"></div>
<script>
document.getElementById('chk').onclick = function(){
  const url = document.getElementById('url').value || 'http://example.com';
  // simulated result
  const headers = {
    'X-Frame-Options':'Missing',
    'X-Content-Type-Options':'nosniff',
    'Content-Security-Policy':'Missing or weak',
    'Strict-Transport-Security':'Missing'
  };
  let out = 'Checked: ' + url + '\n\n';
  for(const k in headers) out += k + ': ' + headers[k] + '\n';
  out += '\nRecommendations:\n- Add X-Frame-Options DENY\n- Add X-Content-Type-Options nosniff\n- Add a strong CSP\- Use HSTS';
  document.getElementById('res').textContent = out;
};
</script></body></html>
